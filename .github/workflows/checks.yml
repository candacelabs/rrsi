# No path filters: every gate here is cheap, and a filtered gate that misses
# a change to its own inputs is green by never looking.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rrsi-mine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/rrsi-mine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Includes the regression tests that a download/infra failure is never
      # scored as a failing test (FAIL_TO_PASS validity).
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --features python -- -D warnings

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" maturin
      - run: maturin build --release -m tools/rrsi-mine/Cargo.toml -o dist && pip install dist/*.whl
      - run: python -m pytest -q tests
      - name: pyo3 bindings keep the FAIL_TO_PASS contract
        run: |
          python - <<'PY'
          import rrsi_mine
          assert rrsi_mine.decide("Infra", "Pass") == (False, "infra: a run could not assemble its build inputs")
          assert rrsi_mine.decide("BuildFail", "Pass")[0] and rrsi_mine.decide("TestFail", "Pass")[0]
          assert not rrsi_mine.decide("Pass", "Pass")[0]
          PY
      - name: pyo3 load_exam returns only exam-ready tasks
        run: |
          python - <<'PY'
          import json, pathlib, tempfile
          import rrsi_mine
          root = pathlib.Path(tempfile.mkdtemp())
          for name, ready in (("aaaaaaaaaaaa", True), ("bbbbbbbbbbbb", False)):
              d = root / name
              (d / "fairness").mkdir(parents=True)
              (d / "task.json").write_text(json.dumps({
                  "sha": name + "0" * 28, "parent": "1" * 40, "subject": "s", "body": "",
                  "module_root": "m", "packages": ["./p"], "src_files": [], "test_files": [],
                  "src_churn": 1, "valid": True, "reason": "ok", "seconds": 0.0}))
              for stage in ("flake", "describe", "probe", "specificity"):
                  (d / "fairness" / f"{stage}.json").write_text(json.dumps(
                      {"stage": stage, "pass": ready or stage != "probe", "reason": ""}))
              (d / "instruction.md").write_text("# Title\n")
          exam = rrsi_mine.load_exam(str(root))
          assert [e["sha12"] for e in exam] == ["aaaaaaaaaaaa"], exam
          assert exam[0]["instruction"] == "# Title\n" and exam[0]["packages"] == ["./p"]
          PY
      - name: pyo3 csf_guard runs CSF's gates on a checkout
        run: |
          python - <<'PY'
          import os, pathlib, stat, tempfile
          import rrsi_mine
          root = pathlib.Path(tempfile.mkdtemp())
          tree = root / "tree"
          (tree / "csf/architecture/generated").mkdir(parents=True)
          (tree / "csf/architecture/architecture.csf").write_text("architecture x version 1 {}\n")
          grammar = root / "language.ebnf"
          grammar.write_text("")
          # Stands in for csfc: check passes, check-generated reports drift.
          fake = root / "csfc"
          fake.write_text('#!/bin/sh\n[ "$1" = --help=plain ] && exit 0\n'
                          '[ "$1" = check ] && { echo "architecture=x mode=check"; exit 0; }\n'
                          'echo "csf/architecture/generated/review_cgen.md:1:1: CSF_GENERATED_DRIFT: run csfc emit" >&2; exit 1\n')
          fake.chmod(fake.stat().st_mode | stat.S_IEXEC)
          v = rrsi_mine.csf_guard(str(tree), csfc=str(fake), grammar=str(grammar))
          assert [(g["gate"], g["status"]) for g in v] == [("csfc check", "pass"), ("csfc check-generated", "fail")], v
          assert v[1]["diagnostics"][0]["code"] == "CSF_GENERATED_DRIFT", v
          skipped = rrsi_mine.csf_guard(str(tree), csfc=str(root / "missing"))
          assert {g["status"] for g in skipped} == {"skipped"}, skipped
          PY
